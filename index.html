  return eff >= 1
    ? '<span class="fithint ok">&rarr;&nbsp;' + best.short + '</span>'
    : '<span class="fithint ' + effClass(eff) + '">&rarr;&nbsp;' + best.short +
      '&nbsp;' + Math.round(eff*100) + '%</span>';
}

/** Colour band for an effectiveness figure. */
function effClass(eff){
  if(eff >= 1)   return 'ok';
  if(eff >= 0.8) return 'mid';
  if(eff >= 0.6) return 'warn';
  return 'bad';
}

        '<div class="vtitle">' + esc(v.title) + '</div>' +

      '</div>' +
      '<div class="ptsrow"><span>Points</span><b data-count="' + pts + '">0</b></div>' +

        CONFIG.SEASON.MATCHES + '">' + squares + '</div>' +

/* ============================================================================
   RENDER + INTERACTION
   ============================================================================ */
function render(){
  const root = ROOT();
  const scroll = root.querySelector('.stage');
  const keepScroll = scroll ? scroll.scrollTop : 0;
  const sameScreen = root.dataset.screen === GAME.screen;

  root.dataset.screen = GAME.screen;
  root.innerHTML =
    GAME.screen === 'title'   ? viewTitle() :
    GAME.screen === 'draft'   ? viewDraft() :
                                viewResults();

  if(sameScreen){
    const s = root.querySelector('.stage');
    if(s) s.scrollTop = keepScroll;
  }

  // Meters sweep in once laid out.
  requestAnimationFrame(() => {
    root.querySelectorAll('.mfill').forEach(el => { el.style.width = el.dataset.w + '%'; });
  });

  // A scoreline should land, not appear.
  root.querySelectorAll('[data-count]').forEach((el, i) => countUp(el, Number(el.dataset.count), i * 90));

  // Move focus into a sheet when one opens, and put it back when it closes.
  const sheet = root.querySelector('.sheet');
  if(sheet){
    if(!lastFocus) lastFocus = document.activeElement;
    const first = sheet.querySelector('button:not(:disabled)');
    if(first) first.focus();
  }else if(lastFocus){
    try{ lastFocus.focus(); }catch(e){}
    lastFocus = null;
  }

  GAME.justFilled = null;
}

let lastFocus = null;

/** Roll a number up to its value. Instant for anyone who asked for less motion. */
function countUp(el, to, delay){
  if(REDUCED || to === 0){ el.textContent = String(to); return; }
  const dur = 620;
  const start = performance.now() + (delay || 0);
  const step = now => {
    const t = (now - start) / dur;
    if(t < 0){ requestAnimationFrame(step); return; }
    if(t >= 1){ el.textContent = String(to); return; }
    el.textContent = String(Math.round(to * (1 - Math.pow(1 - t, 3))));
    requestAnimationFrame(step);
  };
  requestAnimationFrame(step);
}

/* ---- The slot machine ---------------------------------------------------- */
const SPIN_MS = { club: 1500, era: 1850 };

function spinFiller(kind, n){
  const src = kind === 'club' ? POOL.clubs : CONFIG.ERAS;
  const out = [];
  // Cosmetic only — deliberately NOT drawn from the game's seeded stream.
  for(let i=0;i<n;i++) out.push(src[Math.floor(Math.random()*src.length)]);
  return out;
}

function runReel(reelId, kind, target, duration){
  const reel = document.getElementById(reelId);
  if(!reel) return;
  const track = reel.querySelector('.reel-track');
  const items = spinFiller(kind, 12).concat([target]);
  track.innerHTML = items.map(v => reelItemHTML(kind, v)).join('');
  const first = track.firstElementChild;
  const h = (first && first.offsetHeight) || 104;
  const land = items.length - 1;

  track.style.transition = 'none';
  track.style.transform = 'translateY(0px)';
  void track.offsetHeight;                       // force reflow so the reset sticks
  const ms = REDUCED ? 1 : duration;
  track.style.transition = 'transform ' + ms + 'ms cubic-bezier(.12,.72,.18,1)';
  track.style.transform = 'translateY(' + (-land * h) + 'px)';
}

function doSpin(kind){
  if(GAME.phase === 'spinning') return;

  let cell, spinClub = true, spinEra = true;
  if(kind === 'club'){
    if(!GAME.skips.club) return;
    cell = respinClub();
    if(!cell){ toast('No other club from that era is left to draft.'); return; }
    GAME.skips.club--; spinEra = false;
  }else if(kind === 'era'){
    if(!GAME.skips.era) return;
    cell = respinEra();
    if(!cell){ toast('No other era at that club is left to draft.'); return; }
    GAME.skips.era--; spinClub = false;
  }else{
    cell = spinCell();
  }

  GAME.cell = cell;
  GAME.offered = offerFrom(cell);
  GAME.phase = 'spinning';
  render();

  const dur = Math.max(SPIN_MS.club, SPIN_MS.era);
  if(spinClub) runReel('reel-club', 'club', cell.club, SPIN_MS.club);
  if(spinEra)  runReel('reel-era',  'era',  cell.era,  SPIN_MS.era);
  SFX.reelTicks(spinClub && spinEra ? dur : (spinClub ? SPIN_MS.club : SPIN_MS.era));

  const wait = REDUCED ? 30 : (spinClub && spinEra ? dur : (spinClub ? SPIN_MS.club : SPIN_MS.era)) + 120;
  setTimeout(() => {
    GAME.phase = 'picking';
    SFX.detent();
    render();
  }, wait);
}

/* ---- Share --------------------------------------------------------------- */
function shareText(){
  const r = GAME.result, v = verdictFor(r);
  const rows = [];
  for(let i=0;i<r.results.length;i+=10){
    rows.push(r.results.slice(i, i+10)
      .map(c => c === 'W' ? '🟩' : c === 'D' ? '🟨' : '🟥').join(''));
  }
  const six = CONFIG.FORMATION
    .map(s => GAME.lineup[s.id] ? GAME.lineup[s.id].name : null)
    .filter(Boolean).join(' · ');
  return [
    '38-0 ⚽ ' + (GAME.mode === 'daily' ? GAME.seedKey : 'Free play'),
    v.title + ' — ' + r.wins + 'W ' + r.draws + 'D ' + r.losses + 'L · ' + pointsFrom(r) + ' pts',
    '',
    rows.join('\n'),
    '',
    six,
  ].join('\n');
}

function copyShare(){
  const text = shareText();
  const done = ok => toast(ok ? 'Result copied to clipboard' : 'Could not copy — select the text manually');

  try{
    if(navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(text).then(() => done(true), () => legacyCopy(text, done));
      return;
    }
  }catch(e){ /* fall through */ }
  legacyCopy(text, done);
}

function legacyCopy(text, done){
  try{
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly','');
    ta.style.cssText = 'position:fixed;top:0;left:0;width:1px;height:1px;opacity:0';
    document.body.appendChild(ta);
    ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    done(ok);
  }catch(e){ done(false); }
}

/* ---- Events -------------------------------------------------------------- */
function onAction(e){
  const t = e.target.closest('[data-act]');
  if(!t || t.disabled) return;
  const act = t.dataset.act;

  switch(act){
    case 'new-daily': SFX.init(); newGame('daily'); render(); break;
    case 'new-free':  SFX.init(); newGame('free');  render(); break;
    case 'home':      GAME.screen = 'title'; render(); break;

    case 'quit':
      if(GAME.picks.length === 0){ GAME.screen = 'title'; }
      else { GAME.confirmQuit = true; }
      render();
      break;
    case 'quit-no':  GAME.confirmQuit = false; render(); break;
    case 'quit-yes': GAME.confirmQuit = false; GAME.screen = 'title'; render(); break;

    case 'sound':
      SFX.on = !SFX.on;
      if(SFX.on){ SFX.init(); SFX.detent(); }
      render();
      break;

    case 'spin':      SFX.init(); doSpin(null);   break;
    case 'skip-club': SFX.init(); doSpin('club'); break;
    case 'skip-era':  SFX.init(); doSpin('era');  break;

    case 'choose': {
      const p = GAME.offered[Number(t.dataset.i)];
      if(p){ GAME.pending = p; SFX.pick(); render(); }
      break;
    }
    case 'cancel': GAME.pending = null; render(); break;

    case 'assign': {
      const ok = assignPending(t.dataset.slot);
      if(ok){
        if(GAME.screen === 'results'){
          const perfect = GAME.result.wins === CONFIG.SEASON.MATCHES;
          SFX.fanfare(perfect);
          if(!perfect && GAME.result.losses > 8) SFX.thud();
        }else{
          SFX.detent();
        }
        render();
      }
      break;
    }

    case 'share': copyShare(); break;
  }
}

function onKey(e){
  if(e.key === 'Escape' && (GAME.pending || GAME.confirmQuit)){
    GAME.pending = null; GAME.confirmQuit = false; render(); return;
  }
  if(e.key === ' ' && GAME.screen === 'draft' && GAME.phase === 'idle' && e.target === document.body){
    e.preventDefault(); doSpin(null);
  }
}


/* ============================================================================
   7. TESTS — `?test=1`. console.assert is the contract; the on-screen report
   is a convenience. These are the correctness oracle for every milestone.
   ============================================================================ */
const T = { results:[], notes:[], running:false };

function check(name, condition, note){
  const pass = !!condition;
  console.assert(pass, 'FAIL: ' + name + (note ? ' — ' + note : ''));
  T.results.push({ name, pass, note: note || '' });
  return pass;
}

function testPRNG(){
  const a = mulberry32(12345), b = mulberry32(12345), c = mulberry32(12346);
  const sa = [a(),a(),a(),a(),a()];
  const sb = [b(),b(),b(),b(),b()];
  const sc = [c(),c(),c(),c(),c()];
  check('PRNG: same seed produces an identical stream',
    sa.every((v,i)=> v === sb[i]), sa.slice(0,2).join(', '));
  check('PRNG: different seeds diverge',
    sa.some((v,i)=> v !== sc[i]));
  check('PRNG: output stays inside [0,1)',
    sa.every(v => v >= 0 && v < 1));

  // Rough uniformity — a broken PRNG usually fails this loudly.
  const r = mulberry32(99); let sum = 0; const N = 20000;
  for(let i=0;i<N;i++) sum += r();
  const mean = sum / N;
  check('PRNG: mean of 20k draws is near 0.5', Math.abs(mean - 0.5) < 0.02,
    'mean=' + mean.toFixed(4));

  check('hashString: deterministic', hashString('2026-09-18') === hashString('2026-09-18'));
  check('hashString: consecutive dates hash far apart',
    hashString('2026-09-18') !== hashString('2026-09-19'));
  check('hashString: always an unsigned 32-bit int',
    ['','a','the quick brown fox','2026-09-18'].every(s=>{
      const h = hashString(s);
      return Number.isInteger(h) && h >= 0 && h <= 0xFFFFFFFF;
    }));

  const d = new Date(Date.UTC(2026, 8, 18, 23, 59, 59));
  check('utcDateKey: formats as YYYY-MM-DD in UTC',
    utcDateKey(d) === '2026-09-18', utcDateKey(d));

  check('rngShuffle: preserves every member',
    (()=>{
      const src = [1,2,3,4,5,6,7,8];
      const out = rngShuffle(mulberry32(7), src);
      return out.length === src.length && src.every(v => out.includes(v));
    })());
  check('rngShuffle: does not mutate its input',
    (()=>{ const src=[1,2,3,4]; rngShuffle(mulberry32(7), src); return src.join()==='1,2,3,4'; })());
}

function runTests(){
  T.results.length = 0; T.notes.length = 0;
  T.running = true;
  testPRNG();
  if(typeof testData === 'function') testData();
  if(typeof testSim  === 'function') testSim();
  if(typeof testDraft === 'function') testDraft();
  T.running = false;
  if(typeof document !== 'undefined') renderTestReport();
  const failed = T.results.filter(r=>!r.pass).length;
  console.log('[38-0] ' + (T.results.length - failed) + '/' + T.results.length + ' checks passed.');
  return failed === 0;
}

function renderTestReport(){
  const failed = T.results.filter(r=>!r.pass);
  const el = document.createElement('div');
  el.className = 'testrpt';
  const rows = T.results.map(r =>
    '<div class="t-row"><span class="' + (r.pass?'t-pass':'t-fail') + '">' +
    (r.pass?'PASS':'FAIL') + '</span><span class="t-name">' + esc(r.name) +
    (r.note ? '<br><span class="t-note">' + esc(r.note) + '</span>' : '') +
    '</span></div>').join('');
  el.innerHTML =
    '<h2 class="display">Self-test</h2>' +
    '<div class="t-sum ' + (failed.length?'t-fail':'t-pass') + '">' +
      (T.results.length - failed.length) + ' / ' + T.results.length +
      ' checks passed' + (failed.length ? ' — ' + failed.length + ' FAILING' : ' — all green') +
    '</div>' + rows +
    (T.notes.length ? '<pre>' + esc(T.notes.join('\n')) + '</pre>' : '');
  document.body.appendChild(el);
}

/** Minimal HTML escape — used by the report and by every bit of user-ish text. */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => (
    { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]
  ));
}


/* ============================================================================
   BOOT
   ============================================================================ */
function boot(){
  const params = new URLSearchParams(location.search);
  if(params.get('test') === '1'){ runTests(); return; }

  // Sound preference is a convenience, never a hard dependency.
  try{
    const pref = localStorage.getItem(CONFIG.STORAGE_KEY + '.sound');
    if(pref !== null) SFX.on = pref === '1';
  }catch(e){}

  ROOT().addEventListener('click', onAction);
  document.addEventListener('keydown', onKey);
  ROOT().addEventListener('click', () => {
    try{ localStorage.setItem(CONFIG.STORAGE_KEY + '.sound', SFX.on ? '1' : '0'); }catch(e){}
  });

  GAME.screen = 'title';
  render();
}

if(typeof document !== 'undefined') document.addEventListener('DOMContentLoaded', boot);
